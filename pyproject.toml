[project]
name = "agent-eval-gate"
version = "0.0.1"
description = "Evaluation harness and CI gate for tool-using agents: deterministic MCP mock worlds, end-state scoring, calibrated faithfulness judge, bootstrap CIs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "mcp>=1.0",
    "anthropic>=1.12.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
